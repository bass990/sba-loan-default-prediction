name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lint, the contract / golden / adversarial / drift test suite against the
# committed artifacts, then a Docker smoke test of the inference image.
# No training, no data download: the holdout-dependent drift tests skip
# when data/ is absent (it is gitignored).

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install API runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx "ruff==0.16.8"
      - name: Lint
        run: ruff check api/ scripts/ tests/ score_model.py
      - name: Tests
        run: pytest tests/ -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test-api]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sba-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name sba -p 8000:8000 sba-api:ci
          for i in $(seq 1 40); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf http://localhost:8000/model-info | grep -q '"n_features":31'
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d @tests/example_request.json | grep -q probability_1
          docker logs sba | tail -5
          docker rm -f sba
